<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>l0adfun - GitHub Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        * {
            font-family: 'Inter', sans-serif;
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #1a1a1a 0%, #000000 100%);
        }
        
        .card-hover {
            transition: all 0.3s ease;
        }
        
        .card-hover:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        
        .repo-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
        }
        
        .language-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }
        
        .stat-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
        }
        
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }
        
        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 12px;
        }
        
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #1a1a1a;
            border-radius: 6px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #000000;
        }
        
        * {
            scrollbar-width: thin;
            scrollbar-color: #1a1a1a #f1f1f1;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Hero Section -->
    <div class="gradient-bg text-white py-20 px-4">
        <div class="max-w-6xl mx-auto">
            <div class="text-center" id="hero-content">

    </div>

                    </div>
                    <div class="bg-gray-100 p-3 rounded-lg">
                        <i class="fas fa-star text-black text-2xl"></i>
                    </div>
                </div>
            </div>
            <div class="stat-card rounded-xl p-6 shadow-lg card-hover opacity-0">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-600 text-sm font-medium">Total Forks</p>
                        <p id="total-forks" class="text-3xl font-bold text-black mt-1">0</p>
                    </div>
                    <div class="bg-gray-100 p-3 rounded-lg">
                        <i class="fas fa-code-branch text-black text-2xl"></i>
                    </div>
                </div>
            </div>
            <div class="stat-card rounded-xl p-6 shadow-lg card-hover opacity-0">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-600 text-sm font-medium">Public Repos</p>
                        <p id="public-repos" class="text-3xl font-bold text-black mt-1">0</p>
                    </div>
                    <div class="bg-gray-100 p-3 rounded-lg">
                        <i class="fas fa-folder text-black text-2xl"></i>
                    </div>
                </div>
            </div>
            <div class="stat-card rounded-xl p-6 shadow-lg card-hover opacity-0">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-600 text-sm font-medium">Followers</p>
                        <p id="followers-stat" class="text-3xl font-bold text-black mt-1">0</p>
                    </div>
                    <div class="bg-gray-100 p-3 rounded-lg">
                        <i class="fas fa-heart text-black text-2xl"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Search & Filter -->
    <div class="max-w-6xl mx-auto px-4 mb-8">
        <div class="bg-white rounded-xl shadow-md p-6 border border-gray-200">
            <div class="flex flex-col md:flex-row gap-4">
                <div class="flex-1">
                    <input type="text" id="search-input" placeholder="Search repositories..." 
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-black">
                </div>
                <select id="sort-select" class="px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-black">
                    <option value="updated">Recently Updated</option>
                    <option value="stars">Most Stars</option>
                    <option value="forks">Most Forks</option>
                    <option value="name">Name (A-Z)</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Repositories Section -->
    <div class="max-w-6xl mx-auto px-4 pb-12">
        <h2 class="text-3xl font-bold text-gray-800 mb-6">
            <i class="fas fa-code mr-2 text-black"></i>Featured Repositories

        <div id="repos-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">

            <div class="repo-card rounded-xl p-6 shadow-lg skeleton h-48"></div>
            <div class="repo-card rounded-xl p-6 shadow-lg skeleton h-48"></div>
            <div class="repo-card rounded-xl p-6 shadow-lg skeleton h-48"></div>
        </div>
    </div>

        async function fetchUserData() {
            try {
                const response = await fetch(`https://api.github.com/users/${USERNAME}`);
                const data = await response.json();
                
                document.getElementById('avatar').src = data.avatar_url;
                document.getElementById('avatar').classList.remove('skeleton');
                document.getElementById('name').textContent = data.name || data.login;
                document.getElementById('bio').textContent = data.bio || 'No bio available';
                document.getElementById('location').textContent = data.location || 'Unknown';
                document.getElementById('followers').textContent = `${data.followers} followers`;
                document.getElementById('repos-count').textContent = `${data.public_repos} repositories`;
                document.getElementById('profile-link').href = data.html_url;
                
                document.getElementById('public-repos').textContent = data.public_repos;
                document.getElementById('followers-stat').textContent = data.followers;
                
                gsap.to('#hero-content', {
                    opacity: 1,
                    y: 0,
                    duration: 1,
                    ease: 'power3.out'
                });
                
                gsap.to('#stats-grid > div', {
                    opacity: 1,
                    y: 0,
                    duration: 0.8,
                    stagger: 0.1,
                    ease: 'power3.out'
                });
            } catch (error) {
                console.error('Error fetching user data:', error);
                document.getElementById('name').textContent = 'Error loading profile';
                document.getElementById('bio').textContent = 'Please check the username';
            }
        }

        async function fetchRepositories() {
            try {
                const response = await fetch(`https://api.github.com/users/${USERNAME}/repos?per_page=100&sort=updated`);
                allRepos = await response.json();
                
                let totalStars = 0;
                let totalForks = 0;
                
                allRepos.forEach(repo => {
                    totalStars += repo.stargazers_count;
                    totalForks += repo.forks_count;
                });
                
                document.getElementById('total-stars').textContent = totalStars;
                document.getElementById('total-forks').textContent = totalForks;
                
                displayRepositories(allRepos);
            } catch (error) {
                console.error('Error fetching repositories:', error);
            }
        }

        function displayRepositories(repos) {
            const container = document.getElementById('repos-container');
            container.innerHTML = '';
            
            if (repos.length === 0) {
                container.innerHTML = '<p class="text-gray-600 col-span-2 text-center py-8">No repositories found</p>';
                return;
            }
            
            repos.slice(0, 12).forEach((repo, index) => {
                const card = document.createElement('div');
                card.className = 'repo-card rounded-xl p-6 shadow-lg card-hover opacity-0';
                
                const langColor = languageColors[repo.language] || languageColors['default'];
                
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <h3 class="text-xl font-bold text-gray-800 flex-1">
                            <i class="fas fa-book text-black mr-2"></i>${repo.name}
                        </h3>
                        <span class="bg-gray-100 text-black text-xs px-3 py-1 rounded-full font-semibold">
                            ${repo.visibility || 'public'}
                        </span>
                    </div>
                    <p class="text-gray-600 mb-4 line-clamp-2">${repo.description || 'No description available'}</p>
                    <div class="flex items-center gap-4 text-sm text-gray-600 mb-4">
                        ${repo.language ? `
                            <div class="flex items-center gap-1">
                                <span class="language-dot" style="background-color: ${langColor}"></span>
                                <span>${repo.language}</span>
                            </div>
                        ` : ''}
                        <div class="flex items-center gap-1">
                            <i class="fas fa-star text-yellow-500"></i>
                            <span>${repo.stargazers_count}</span>
                        </div>
                        <div class="flex items-center gap-1">
                            <i class="fas fa-code-branch text-gray-600"></i>
                            <span>${repo.forks_count}</span>
                        </div>
                    </div>
                    <a href="${repo.html_url}" target="_blank" 
                       class="inline-flex items-center text-black hover:text-gray-700 font-semibold">
                        View Repository <i class="fas fa-arrow-right ml-2"></i>
                    </a>
                `;
                
                container.appendChild(card);
                
                gsap.to(card, {
                    opacity: 1,
                    y: 0,
                    duration: 0.6,
                    delay: index * 0.1,
                    ease: 'power3.out'
                });
            });
        }

        function filterAndSortRepos() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const sortBy = document.getElementById('sort-select').value;
            
            let filtered = allRepos.filter(repo => 
                repo.name.toLowerCase().includes(searchTerm) ||
                (repo.description && repo.description.toLowerCase().includes(searchTerm))
            );
            
            filtered.sort((a, b) => {
                switch(sortBy) {
                    case 'stars':
                        return b.stargazers_count - a.stargazers_count;
                    case 'forks':
                        return b.forks_count - a.forks_count;
                    case 'name':
                        return a.name.localeCompare(b.name);
                    case 'updated':
                    default:
                        return new Date(b.updated_at) - new Date(a.updated_at);
                }
            });
            
            displayRepositories(filtered);
        }

        document.getElementById('search-input').addEventListener('input', filterAndSortRepos);
        document.getElementById('sort-select').addEventListener('change', filterAndSortRepos);

        // Initialize
        fetchUserData();
        fetchRepositories();
        
        // Animate hero on load
        gsap.from('#hero-content', {
            y: 30,
            duration: 1,
            opacity: 0
        });
    </script>
</body>
</html>
